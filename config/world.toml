# The simulated retailer's customer care: who contacts, about what, through which channel, and when.
seed = 20261111
start = "2023-01-01"
end = "2025-12-31"
dev_cutoff = "2025-09-28"          # the held-out forecasts start the day after

[markets]  # base daily orders
DE = 60000
FR = 30000
IT = 22000
ES = 12000
NL = 15000
PL = 14000
AT = 9000
CH = 8000
BE = 9000
SE = 7000

[orders]
growth_per_year = 0.04
noise = 0.06
weekday = [1.08, 1.02, 0.98, 0.97, 0.95, 0.98, 1.02]   # Monday first
cyber_week_peak = 2.4               # Black Friday
sale_uplift = 1.4                   # first ten days of the end-of-season sales
holiday = 0.7
plan_error = 0.08                   # the commercial order plan is wrong by this much (log sd)
cyber_week_plan_error = 0.18

[contacts]
# contacts per order, and the lag kernel (days after the order) for each order-driven reason
reasons = ["wismo", "delivery_issue", "return_refund", "payment", "lounge", "account_other"]
rate = { wismo = 0.040, delivery_issue = 0.014, return_refund = 0.030, payment = 0.008, lounge = 0.020 }
lag = { wismo = [2, 7, 4], delivery_issue = [1, 6, 3], return_refund = [8, 28, 14], payment = [0, 1, 0], lounge = [3, 10, 5] }
account_other_per_1k_orders = 9.0   # a baseline not tied to recent orders
weekday = [1.18, 1.08, 1.02, 1.00, 0.95, 0.72, 0.55]
holiday = 0.45
rebound = 0.30                      # share of a holiday's missing contacts that arrive the next working day
noise = 0.05
lounge_share_of_orders = 0.2
returns_after_peaks = 1.3           # orders from Cyber Week and sales are returned more

[channels]
# share by reason: phone, chat, email; chat gains this much per year from email
phone = { wismo = 0.30, delivery_issue = 0.35, return_refund = 0.25, payment = 0.40, lounge = 0.25, account_other = 0.30 }
chat = { wismo = 0.45, delivery_issue = 0.40, return_refund = 0.40, payment = 0.40, lounge = 0.50, account_other = 0.35 }
chat_gain_per_year = 0.06

[bot]
# a self-service bot for order status, launched in some markets: the natural experiment
launch = "2025-04-01"
markets = ["DE", "AT", "NL"]
wismo_effect = -0.22
ramp_days = 14

[intraday]
open = 8          # 08:00 to 22:00, half-hour intervals
close = 22

# Incidents nobody can plan for. Only the evaluation reads this list.
[[incidents]]
start = "2023-06-13"
days = 1
markets = "all"
effects = { payment = 5.0 }
[[incidents]]
start = "2024-02-20"
days = 3
markets = ["FR"]
effects = { wismo = 2.4, delivery_issue = 2.0 }
[[incidents]]
start = "2024-09-10"
days = 4
markets = ["PL"]
effects = { wismo = 1.8 }
[[incidents]]
start = "2025-03-18"
days = 1
markets = ["DE"]
effects = { payment = 4.0, account_other = 1.5 }
[[incidents]]
start = "2025-07-08"
days = 2
markets = ["IT"]
effects = { wismo = 2.2, delivery_issue = 1.8 }
[[incidents]]
start = "2025-10-21"
days = 3
markets = ["NL"]
effects = { wismo = 2.3, delivery_issue = 1.9 }
[[incidents]]
start = "2025-11-12"
days = 1
markets = "all"
effects = { payment = 4.5 }
[[incidents]]
start = "2025-12-09"
days = 2
markets = ["ES"]
effects = { wismo = 1.9 }
